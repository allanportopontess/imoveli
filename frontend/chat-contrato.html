<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — IMOVELI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --violet: #6E30D9; --violet-deep: #4B1F94; --violet-wash: #F2ECFC;
      --mint: #16B378; --coral: #FF4B5C; --ink: #161616; --ink-soft: #6B6B70;
      --paper: #FAFAFA; --mist: #EAE8ED; --amber: #F59E0B;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html, body { height: 100%; font-family: var(--font); background: var(--paper); color: var(--ink); overflow: hidden; }

    /* TOPBAR */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 60px; background: var(--violet); color: #fff;
      display: flex; align-items: center; gap: 12px; padding: 0 16px;
    }
    .btn-back { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .btn-back:hover { background: rgba(255,255,255,.15); }
    .topbar-info { flex: 1; min-width: 0; }
    .topbar-nome { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-sub { font-size: 11px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-badge { background: rgba(255,255,255,.2); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 700; flex-shrink: 0; }

    /* CONTRATO INFO */
    .contrato-info {
      position: fixed; top: 60px; left: 0; right: 0; z-index: 90;
      background: #fff; border-bottom: 1px solid var(--mist);
      padding: 10px 16px; display: flex; gap: 12px; align-items: center;
    }
    .contrato-tag { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
    .tag-pago { background: #edf9f4; color: var(--mint); }
    .tag-pendente { background: #fff8e1; color: #a36a00; }
    .contrato-escopo { font-size: 12px; color: var(--ink-soft); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contrato-valor { font-size: 13px; font-weight: 700; color: var(--violet); flex-shrink: 0; }

    /* MESSAGES AREA */
    .messages-area {
      position: fixed; top: 108px; left: 0; right: 0; bottom: 68px;
      overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 8px;
      scroll-behavior: smooth;
    }

    /* BUBBLES */
    .bubble-wrap { display: flex; flex-direction: column; }
    .bubble-wrap.mine { align-items: flex-end; }
    .bubble-wrap.deles { align-items: flex-start; }

    .bubble {
      max-width: 75%; padding: 10px 14px; border-radius: 16px;
      font-size: 14px; line-height: 1.5; word-break: break-word;
    }
    .bubble.mine { background: var(--violet); color: #fff; border-bottom-right-radius: 4px; }
    .bubble.deles { background: #fff; color: var(--ink); border: 1px solid var(--mist); border-bottom-left-radius: 4px; }

    .bubble-meta { font-size: 10px; color: var(--ink-soft); margin-top: 3px; }
    .bubble-wrap.mine .bubble-meta { text-align: right; }
    .bubble-nome { font-weight: 700; margin-bottom: 2px; font-size: 11px; color: var(--violet); }

    .system-msg { text-align: center; font-size: 12px; color: var(--ink-soft); padding: 4px 0; }

    /* LOADING */
    .loading-chat { display: flex; align-items: center; justify-content: center; height: 100%; flex-direction: column; gap: 12px; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--mist); border-top-color: var(--violet); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .erro-msg { color: var(--coral); font-size: 14px; text-align: center; padding: 20px; }

    /* TYPING INDICATOR */
    .typing { display: none; padding: 4px 16px; }
    .typing.visivel { display: flex; gap: 4px; align-items: center; }
    .dot { width: 7px; height: 7px; background: var(--ink-soft); border-radius: 50%; animation: bounce .9s infinite; }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    /* INPUT AREA */
    .input-area {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #fff; border-top: 1px solid var(--mist);
      padding: 10px 12px;
      display: flex; gap: 8px; align-items: flex-end;
      min-height: 68px;
    }
    .input-area textarea {
      flex: 1; padding: 10px 14px; border: 1.5px solid var(--mist);
      border-radius: 22px; font-size: 14px; font-family: var(--font);
      resize: none; outline: none; max-height: 120px; line-height: 1.4;
      background: var(--paper);
    }
    .input-area textarea:focus { border-color: var(--violet); }
    .btn-send {
      width: 44px; height: 44px; border-radius: 50%; background: var(--violet);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background .15s;
    }
    .btn-send:hover { background: var(--violet-deep); }
    .btn-send:disabled { background: var(--mist); cursor: not-allowed; }
    .btn-send svg { fill: #fff; }

    /* DATA SEPARATOR */
    .date-sep { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 8px 0; }
    .date-sep span { background: var(--mist); padding: 2px 10px; border-radius: 10px; }

    /* Locked state */
    .chat-locked { text-align: center; padding: 40px 20px; }
    .chat-locked h3 { font-size: 17px; font-weight: 800; color: var(--ink); margin-bottom: 8px; }
    .chat-locked p { font-size: 13px; color: var(--ink-soft); line-height: 1.6; margin-bottom: 20px; }
    .btn-pagar-agora { display: inline-block; padding: 12px 24px; background: var(--mint); color: #fff; border-radius: 10px; font-weight: 700; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <button class="btn-back" onclick="history.back()">←</button>
  <div class="topbar-info">
    <div class="topbar-nome" id="topNome">Carregando…</div>
    <div class="topbar-sub" id="topSub"></div>
  </div>
  <div class="topbar-badge" id="topBadge"></div>
</div>

<!-- CONTRATO INFO -->
<div class="contrato-info" id="contratoInfo" hidden>
  <span class="contrato-tag" id="contratoTag"></span>
  <span class="contrato-escopo" id="contratoEscopo"></span>
  <span class="contrato-valor" id="contratoValor"></span>
</div>

<!-- MESSAGES -->
<div class="messages-area" id="messagesArea">
  <div class="loading-chat">
    <div class="spinner"></div>
    <p style="color:var(--ink-soft);font-size:14px;">Carregando conversa…</p>
  </div>
</div>

<div class="typing" id="typingIndicator">
  <div class="dot"></div><div class="dot"></div><div class="dot"></div>
</div>

<!-- INPUT -->
<div class="input-area" id="inputArea" hidden>
  <textarea id="msgInput" placeholder="Digite uma mensagem…" rows="1"
    oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
  <button class="btn-send" id="btnSend" onclick="enviarMensagem()">
    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
  </button>
</div>

<script>
const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:3001' : '';

const params     = new URLSearchParams(location.search);
const CONTRATO_ID = params.get('id');
const token      = localStorage.getItem('imoToken') || '';

let meuEmail    = '';
let mensagens   = [];
let sseConn     = null;
let contrato    = null;
let papel       = '';

if (!token) {
  location.href = '/index.html';
} else if (!CONTRATO_ID) {
  document.getElementById('messagesArea').innerHTML = '<p class="erro-msg">ID do contrato não informado.</p>';
} else {
  iniciar();
}

async function iniciar() {
  // Decodifica email do JWT
  try {
    const payload = JSON.parse(atob(token.split('.')[1]));
    meuEmail = payload.email;
  } catch (_) {}

  await carregarMensagens();
}

async function carregarMensagens() {
  try {
    const r = await fetch(`${API}/api/chat/${CONTRATO_ID}/mensagens`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await r.json();

    if (!data.success) {
      if (data.error?.includes('Pagamento pendente')) {
        renderChatBloqueado();
      } else {
        document.getElementById('messagesArea').innerHTML = `<p class="erro-msg">${data.error}</p>`;
      }
      return;
    }

    contrato = data.contrato;
    papel    = data.papel;
    mensagens = data.mensagens || [];

    renderContratoInfo();
    renderMensagens();
    document.getElementById('inputArea').hidden = false;
    conectarSSE();
  } catch (e) {
    document.getElementById('messagesArea').innerHTML = `<p class="erro-msg">Erro ao carregar chat: ${e.message}</p>`;
  }
}

function renderContratoInfo() {
  const c = contrato;
  document.getElementById('topNome').textContent = c.profissional_nome;
  document.getElementById('topSub').textContent = papel === 'cliente' ? 'Profissional contratado' : 'Cliente';
  document.getElementById('topBadge').textContent = papel === 'cliente' ? '👷 RT' : '👤 Cliente';

  const tag = document.getElementById('contratoTag');
  tag.textContent = c.status === 'pago' ? '✅ Pago' : c.status;
  tag.className = `contrato-tag ${c.status === 'pago' ? 'tag-pago' : 'tag-pendente'}`;

  document.getElementById('contratoEscopo').textContent = c.escopo;
  document.getElementById('contratoValor').textContent = `R$${parseFloat(c.valor_servico).toFixed(2)}`;
  document.getElementById('contratoInfo').hidden = false;

  document.title = `Chat — ${c.profissional_nome} | IMOVELI`;
}

function renderMensagens() {
  const area = document.getElementById('messagesArea');
  if (!mensagens.length) {
    area.innerHTML = `<div class="system-msg">Conversa iniciada. Olá! 👋</div>`;
    return;
  }

  let html = '';
  let ultimaData = '';

  for (const m of mensagens) {
    const data = new Date(m.created_at).toLocaleDateString('pt-BR');
    if (data !== ultimaData) {
      html += `<div class="date-sep"><span>${data === new Date().toLocaleDateString('pt-BR') ? 'Hoje' : data}</span></div>`;
      ultimaData = data;
    }
    html += renderBubble(m);
  }

  area.innerHTML = html;
  scrollBottom();
}

function renderBubble(m) {
  const minha = m.remetente_email === meuEmail;
  const hora  = new Date(m.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  return `<div class="bubble-wrap ${minha ? 'mine' : 'deles'}">
    ${!minha ? `<div class="bubble-nome">${escHtml(m.remetente_nome)}</div>` : ''}
    <div class="bubble ${minha ? 'mine' : 'deles'}">${escHtml(m.conteudo)}</div>
    <div class="bubble-meta">${hora}${minha && m.lida ? ' ✓✓' : ''}</div>
  </div>`;
}

function renderChatBloqueado() {
  document.getElementById('topNome').textContent = 'Chat bloqueado';
  document.getElementById('messagesArea').innerHTML = `
    <div class="chat-locked">
      <div style="font-size:48px;margin-bottom:16px;">🔒</div>
      <h3>Pagamento pendente</h3>
      <p>Confirme o pagamento para liberar a conversa com o profissional.</p>
      <a href="/index.html" class="btn-pagar-agora">Ir para Contratos</a>
    </div>`;
}

async function enviarMensagem() {
  const input = document.getElementById('msgInput');
  const texto = input.value.trim();
  if (!texto) return;

  const btn = document.getElementById('btnSend');
  btn.disabled = true;
  input.value = '';
  autoResize(input);

  try {
    const r = await fetch(`${API}/api/chat/${CONTRATO_ID}/mensagens`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ conteudo: texto })
    });
    const data = await r.json();
    if (!data.success) throw new Error(data.error);
    // Mensagem aparece via SSE (ou adiciona localmente se SSE falhar)
    adicionarMensagem(data.mensagem);
  } catch (e) {
    alert('Erro ao enviar: ' + e.message);
    input.value = texto;
    autoResize(input);
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

function adicionarMensagem(m) {
  const area = document.getElementById('messagesArea');
  // Evita duplicata (SSE pode trazer a mesma que já adicionamos)
  if (area.querySelector(`[data-mid="${m.id}"]`)) return;

  const div = document.createElement('div');
  div.setAttribute('data-mid', m.id);
  div.innerHTML = renderBubble(m);
  area.appendChild(div.firstElementChild);
  scrollBottom();
}

function conectarSSE() {
  if (sseConn) sseConn.close();
  const url = `${API}/api/chat/${CONTRATO_ID}/stream`;
  sseConn = new EventSource(url, {
    // EventSource nativo não suporta headers; usa workaround via URL com token
  });

  // Como EventSource não suporta Authorization header, uso polling como fallback
  // SSE funciona sem auth por enquanto (protegido pela validade do contrato)
  sseConn.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.tipo === 'mensagem') adicionarMensagem(data.mensagem);
    } catch (_) {}
  };

  sseConn.onerror = () => {
    // Reconecta após 5s se cair
    setTimeout(conectarSSE, 5000);
  };
}

// Polling como fallback para SSE com auth (EventSource não suporta headers)
// O SSE acima funciona enquanto o token for válido no cookie de sessão;
// para auth via Bearer token usamos polling a cada 5s como complemento
let ultimoId = 0;
setInterval(async () => {
  if (!CONTRATO_ID || !token) return;
  try {
    const r = await fetch(`${API}/api/chat/${CONTRATO_ID}/mensagens`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const data = await r.json();
    if (!data.success) return;
    const novas = (data.mensagens || []).filter(m => !document.querySelector(`[data-mid="${m.id}"]`));
    novas.forEach(adicionarMensagem);
  } catch (_) {}
}, 5000);

function scrollBottom() {
  const area = document.getElementById('messagesArea');
  area.scrollTop = area.scrollHeight;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarMensagem(); }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}

window.addEventListener('beforeunload', () => { if (sseConn) sseConn.close(); });
</script>
</body>
</html>
